<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Rounded green background -->
  <rect width="64" height="64" rx="12" fill="url(#fg)"/>

  <!-- Trefoil knot — simplified, bold, high-contrast for tiny sizes -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="32" cy="22" r="10"/>
    <circle cx="22" cy="40" r="10"/>
    <circle cx="42" cy="40" r="10"/>
  </g>

  <!-- Gold center dot (data/wheat accent) -->
  <circle cx="32" cy="34" r="3.5" fill="#fbbf24" stroke="#ffffff" stroke-width="1"/>
</svg>
