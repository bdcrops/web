<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="knotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="50%"  stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="knotGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#15803d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Trefoil knot — three interlocking lobes -->
  <g filter="url(#softShadow)">

    <!-- Lobe 1: Top -->
    <path d="M 100 20
             C 140 20, 165 55, 150 90
             C 140 110, 115 115, 100 100
             C 85 115, 60 110, 50 90
             C 35 55, 60 20, 100 20 Z"
          fill="url(#knotGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

    <!-- Lobe 2: Bottom-left -->
    <path d="M 50 90
             C 25 105, 20 145, 55 165
             C 80 175, 110 160, 110 135
             C 110 118, 100 108, 88 105
             C 70 100, 55 95, 50 90 Z"
          fill="url(#knotGrad2)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

    <!-- Lobe 3: Bottom-right -->
    <path d="M 150 90
             C 175 105, 180 145, 145 165
             C 120 175, 90 160, 90 135
             C 90 118, 100 108, 112 105
             C 130 100, 145 95, 150 90 Z"
          fill="url(#knotGrad)" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>

    <!-- Center highlight (subtle wheat/leaf accent) -->
    <circle cx="100" cy="115" r="8" fill="#fef3c7" opacity="0.9"/>
    <circle cx="100" cy="115" r="4" fill="#f59e0b"/>

  </g>
</svg>
