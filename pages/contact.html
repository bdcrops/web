<meta name="page:title" content="Contact — BDCrops">
<meta name="page:description" content="Email, WhatsApp, or LinkedIn. Dhaka, Bangladesh.">
<meta name="page:canonical" content="https://bdcrops.com/contact">

<section class="hero fade-in">
    <div class="features-container">
        <div class="section-header">
            <h1 class="section-title">Contact Us</h1>
            <p class="section-subtitle">We respond within 24 hours via email &amp; WhatsApp.</p>
        </div>
    </div>
</section>

<section class="pilot-section">
    <div class="container">
        <form id="contact-form" class="pilot-form fade-in">
            <input type="text" name="_honeypot" style="position:absolute;left:-9999px;">
            <div class="form-row">
                <input type="text" name="name" placeholder="Your Name *" required>
                <input type="text" name="org" placeholder="Organization">
            </div>
            <input type="email" name="email" placeholder="Email *" required>
            <input type="tel" name="phone" placeholder="WhatsApp / Phone">
            <textarea name="message" rows="5" placeholder="Your message *" required></textarea>
            <button type="submit" class="btn-primary btn-lg">Send Message</button>
            <div class="pilot-status" role="status" aria-live="polite"></div>
        </form>
    </div>
</section>
